<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Rúnica — Escanea la sala</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#14110D" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style.css" />

<!-- A-Frame + MindAR (image tracking). Se cargan desde CDN, se ejecutan en el móvil del jugador. -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

<div id="player-view">

  <!-- Fondo ambiental: rota imágenes libres de derechos relacionadas con la
       historia mientras no se está escaneando con la cámara. -->
  <div id="fondo-ambiente">
    <img id="fondo-img-a" class="fondo-img" />
    <img id="fondo-img-b" class="fondo-img" />
  </div>

  <div id="hud-top">
    <span class="player-name mono" id="player-name-label">Cargando...</span>
    <div style="display:flex; gap:.4em;">
      <button id="btn-toggle-musica" style="font-size:.75rem;padding:.4em .8em;" title="Música ambiente">🎵</button>
      <button id="btn-toggle-voz" style="font-size:.75rem;padding:.4em .8em;" title="Cambiar voz">🔊</button>
      <button id="btn-logout" style="font-size:.75rem;padding:.4em .8em;">Salir</button>
    </div>
  </div>

  <audio id="musica-ambiente" loop></audio>

  <div id="combate-bar" class="mono">
    <span id="combate-bar-texto"></span>
    <div id="combate-daño-form" style="display:none;">
      <select id="combate-objetivo"></select>
      <input id="combate-daño-valor" type="number" min="0" value="0" />
      <select id="combate-tipo-danio" title="Tipo de daño">
        <option value="fisico">🗡️</option>
        <option value="fuego">🔥</option>
        <option value="hielo">❄️</option>
        <option value="veneno">☠️</option>
        <option value="mental">🌀</option>
      </select>
      <button id="btn-aplicar-daño">Aplicar daño</button>
    </div>
  </div>

  <div class="rune-ring" id="rune-ring"></div>
  <div id="scanning-hint">Apunta la cámara a un marcador de la sala</div>

  <div id="narration-box">
    <button id="btn-cerrar-narracion" style="float:right; font-size:.7rem; padding:.3em .6em;">✕</button>
    <p id="narration-text"></p>
    <button id="btn-speak" class="primary" style="margin-top:.5em;">🔊 Escuchar narración</button>
  </div>

  <!-- Aviso corto y centrado, para acciones puntuales (uso de habilidades,
       detecciones...) que no son la narración de una escena: se autocierra
       solo y no requiere que nadie la cierre a mano. -->
  <div id="toast-box"><p id="toast-text"></p></div>

  <!-- La escena AR se inyecta aquí en tiempo de ejecución (ver js/app.js),
       pero la cámara solo se activa cuando el jugador pulsa "Inspeccionar". -->
  <div id="ar-scene-container"></div>

  <!-- Chat transparente, siempre superpuesto (sobre el fondo ambiental o
       sobre la cámara), estilo overlay de stream: sin cajas, minimalista. -->
  <div id="chat-overlay"></div>

  <div id="hud-bottom">
    <span class="stat-pill" id="stat-hp">❤ --</span>
    <button id="btn-accion">✍️ Chat</button>
    <button id="btn-inspeccionar" class="primary">🔍 Inspeccionar</button>
    <button id="btn-dice">🎲 Dado</button>
    <button id="btn-ficha">📜</button>
    <span class="stat-pill" id="stat-inventory">🎒 --</span>
  </div>

  <div id="accion-modal" class="modal-overlay">
    <div class="card" style="max-width:420px; width:90%;">
      <h3 class="display" style="font-size:1rem;">Escribe en el chat</h3>
      <p style="color:var(--parchment-dim); font-size:.8rem;">Lo verán el resto de jugadores en pantalla y el master en su registro.</p>
      <textarea id="accion-texto" rows="3" placeholder="Ej: registro el cofre con cuidado, atenta a trampas..."></textarea>
      <div style="display:flex; gap:.6em; margin-top:.6em;">
        <button id="btn-enviar-accion" class="primary">Enviar</button>
        <button id="btn-cerrar-accion">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="habilidad-ataque-modal" class="modal-overlay">
    <div class="card" style="max-width:380px; width:90%;">
      <h3 class="display" style="font-size:1rem;" id="habilidad-ataque-titulo">Elige objetivo</h3>
      <p class="mono" id="habilidad-ataque-tirada" style="color:var(--amber);"></p>
      <select id="habilidad-ataque-objetivo" style="width:100%; margin:.6em 0;"></select>
      <div style="display:flex; gap:.6em;">
        <button id="btn-confirmar-ataque" class="primary">Atacar</button>
        <button id="btn-cancelar-ataque">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- Tirada de una escena (p.ej. "cruza el puente: tirada de destreza"):
       aparece en medio de la pantalla de todos los jugadores en cuanto la
       escena se activa, y se resuelve sola al pulsar "Tirar". -->
  <div id="prueba-modal" class="modal-overlay">
    <div class="card" style="max-width:420px; width:90%; text-align:center;">
      <h3 class="display" id="prueba-titulo" style="font-size:1.1rem;">Prueba</h3>
      <p id="prueba-condiciones" style="color:var(--parchment-dim); font-size:.9rem;"></p>
      <button id="btn-tirar-prueba" class="primary" style="margin:.8em 0; font-size:1.1rem;">🎲 Tirar</button>
      <p id="prueba-resultado" class="mono" style="color:var(--amber); min-height:1.4em;"></p>
      <button id="btn-cerrar-prueba" style="margin-top:.6em;">Cerrar</button>
    </div>
  </div>

  <div id="ficha-modal" class="modal-overlay">
    <div class="card" id="ficha-content" style="max-width:480px; width:90%; max-height:85vh; overflow-y:auto;">
      <button id="btn-cerrar-ficha" style="float:right; font-size:.75rem;">✕ Cerrar</button>
      <div id="ficha-retrato"></div>
      <h2 class="display" id="ficha-nombre" style="font-size:1.2rem;"></h2>
      <p class="mono" id="ficha-raza-clase" style="color:var(--parchment-dim); font-size:.8rem;"></p>
      <div id="ficha-atributos" class="grid-3" style="margin:.8em 0;"></div>
      <h3 style="font-size:1rem;">Habilidades</h3>
      <div id="ficha-habilidades"></div>
      <h3 style="font-size:1rem; margin-top:1em;">Inventario</h3>
      <div id="ficha-inventario"></div>
      <button id="btn-imprimir-ficha" style="margin-top:1em; width:100%;">🖨️ Imprimir ficha</button>
    </div>
  </div>

</div>

<script type="module" src="/js/app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/service-worker.js').catch(console.warn);
    });
  }
</script>
</body>
</html>
